name: Crawler E2E
on:
  workflow_dispatch:
jobs:
  live-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: BACity-
    steps:
      - uses: actions/checkout@v4
      - name: Start database and API
        run: |
          cp .env.example .env
          docker compose up --build --wait postgres api
      - name: Crawl live sources
        run: |
          docker compose build worker
          docker compose run --rm -e CRAWLER_JOB_TIMEOUT=180 worker python -m crawler.worker --once
      - name: Verify persisted events, evidence and map
        run: |
          docker compose exec -T api python - <<'PY'
          import json, urllib.request
          def get(path):
              return json.load(urllib.request.urlopen('http://localhost:8000' + path, timeout=10))
          data = get('/events?limit=100')
          assert data['total'] > 0, data
          assert all(e['sources'] for e in data['items'])
          assert get('/events/nearby?lat=48.1486&lng=17.1077&radius_km=20&limit=100')
          print('Live pipeline verified:', data['total'], 'events')
          PY
      - name: Save logs and stop
        if: always()
        run: |
          docker compose logs > live-crawl.log
          docker compose run --rm --no-deps worker python -m crawler.worker --status > crawler-status.json
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-crawl
          path: |
            BACity-/live-crawl.log
            BACity-/crawler-status.json
